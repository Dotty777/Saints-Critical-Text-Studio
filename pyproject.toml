[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saints-critical-text-studio"
version = "1.1.0"
description = "Self-contained, offline-first native desktop app & AI witness gatekeeper for reconstructing the open-source Saints Greek, Hebrew, and Latin Biblical Critical Texts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24.0"]
xml = ["lxml>=5.0.0"]
cloud-gemini = ["google-genai>=3.2.0"]
claude-review = ["anthropic"]

[project.scripts]
saints-critical-text-cli = "cli:main"
critical-text-cli = "cli:main"

[project.gui-scripts]
saints-critical-text-studio = "app:main"
critical-text-studio = "app:main"
